version: 1
send_anonymous_usage_stats: true
project_id: tap-onspd
default_environment: test
environments:
- name: test
plugins:
  extractors:
  - name: tap-onspd
    namespace: tap_onspd
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings:
    - name: item_id
      label: Release item ID
      description: ArcGIS item ID of a specific ONSPD release. Latest release when omitted.
    - name: download_dir
      label: Download directory
      description: Where the release zip is downloaded during a sync. Defaults to <system temp>/tap-onspd.
    - name: keep_download
      kind: boolean
      label: Keep download
      value: false
    - name: exclude_countries
      kind: array
      label: Exclude countries
      value: [N92000002, L93000001, M83000003]
    - name: member_pattern
      label: Postcode file pattern
    - name: lookups
      kind: object
      label: Lookup streams
    - name: strip_vintage_suffixes
      kind: boolean
      label: Strip vintage suffixes
      value: true
    - name: force_reload
      kind: boolean
      label: Force reload
      value: false
    - name: api_url
      label: ArcGIS API URL
    config:
      download_dir: .meltano/tap-onspd
      keep_download: true
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
