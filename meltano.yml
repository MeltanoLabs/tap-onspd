version: 1
send_anonymous_usage_stats: true
project_id: tap-onspd
default_environment: test
environments:
- name: test
plugins:
  extractors:
  - name: tap-onspd
    namespace: tap_onspd
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings:
    - name: exclude_countries
      kind: array
      label: Exclude countries
      value: [northern_ireland, channel_islands, isle_of_man]
    - name: strip_vintage_suffixes
      kind: boolean
      label: Strip vintage suffixes
      value: true
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
