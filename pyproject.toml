[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.5",
  "hatchling>=1.31,<2",
]

[project]
name = "tap-onspd"
description = "Singer tap for the ONS Postcode Directory (ONSPD), built with the Meltano Singer SDK."
readme = "README.md"
keywords = [
  "ELT",
  "Meltano",
  "ONS",
  "ONSPD",
  "postcodes",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "requests~=2.34.0",
  "singer-sdk~=0.54.0",
  "typing-extensions>=4.5; python_version<'3.12'",
]
[[project.authors]]
name = "Naveen"
email = "naveen@meltano.com"
[project.urls]
Homepage = "https://github.com/MeltanoLabs/tap-onspd"
Repository = "https://github.com/MeltanoLabs/tap-onspd"
[project.scripts]
# CLI declaration
tap-onspd = "tap_onspd.tap:TapONSPD.cli"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest>=8",
  "responses>=0.25",
]
typing = [
  "mypy>=1.15",
  "types-requests>=2.32",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.ruff]
line-length = 120
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",    # assert is used by pytest
  "PLR2004", # magic values in assertions
  "SLF001",  # tests poke at private helpers
  "D",       # test names describe the behaviour
]
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "COM812", # missing-trailing-comma
  "CPY001", # copyright notice missing
  "FIX",    # allow TODO comments
]
future-annotations = true

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-v -ra --strict-markers"
testpaths = [ "tests" ]
log_level = "INFO"

[tool.tox]
requires = [
  "tox>=4.24",
  "tox-uv",
]
env_list = [ "typing", "3.10", "3.11", "3.12", "3.13" ]
[tool.tox.env.typing]
description = "type checks with mypy"
dependency_groups = [ "test", "typing" ]
commands = [ [ "mypy", { replace = "posargs", default = [ "tap_onspd", "tests" ], extend = true } ] ]
[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run tests on Python {env_name}"
dependency_groups = [ "test" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
