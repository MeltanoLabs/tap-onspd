[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.5",
  "hatchling>=1.31,<2",
]

[project]
name = "tap-onspd"
description = "Singer tap for the ONS Postcode Directory (ONSPD), built with the Meltano Singer SDK."
readme = "README.md"
keywords = [
  "ELT",
  "Meltano",
  "ONS",
  "ONSPD",
  "postcodes",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "requests~=2.34.0",
  "singer-sdk~=0.54.9",
  "typing-extensions>=4.5; python_version<'3.12'",
]
[[project.authors]]
name = "Naveen"
email = "naveen@meltano.com"
[project.urls]
Homepage = "https://github.com/MeltanoLabs/tap-onspd"
Repository = "https://github.com/MeltanoLabs/tap-onspd"
[project.scripts]
# CLI declaration
tap-onspd = "tap_onspd.tap:TapONSPD.cli"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest>=9",
  "pytest-github-actions-annotate-failures>=0.4",
  "responses>=0.25",
  "singer-sdk[testing]",
]
typing = [
  "mypy>=2.1",
  "ty>=0.0.41",
  "types-requests>=2.32",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.ruff]
line-length = 120
required-version = ">=0.16.0"
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",    # assert is used by pytest
  "PLR2004", # magic values in assertions
  "SLF001",  # tests poke at private helpers
  "D",       # test names describe the behaviour
]
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "COM812", # missing-trailing-comma
  "FIX",    # allow TODO comments
]
future-annotations = true

[tool.mypy]
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_unused_configs = true

[tool.ty.rules]
missing-override-decorator = "error"
unused-type-ignore-comment = "ignore"

[tool.pytest]
addopts = [ "-ra" ]
filterwarnings = [
  "error",
  "once:No records were available to test:UserWarning",
  "once:Fields in transformed catalog but not in records:UserWarning",
  "once:Python 3.* its end of life:FutureWarning",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.tox]
requires = [
  "tox>=4.53",
  "tox-uv>=1.35",
]
env_list = [ "typing", { prefix = "3.", start = 10 } ]
[tool.tox.env.typing]
description = "type checks"
dependency_groups = [ "test", "typing" ]
commands = [
  [ "mypy", { replace = "posargs", default = [ "tap_onspd", "tests" ], extend = true } ],
  [ "ty", "check", { replace = "posargs", default = [ "tap_onspd", "tests" ], extend = true } ],
]
[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run tests on Python {env_name}"
pass_env = [ "CI", "GITHUB_*", "TAP_ONSPD_*" ]
dependency_groups = [ "test" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
